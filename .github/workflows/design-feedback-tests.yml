name: Design Feedback Pack Tests
on:
  pull_request:
    branches: [main]
    paths: ['packs/design-feedback/**', '.github/workflows/design-feedback-tests.yml']
  push:
    branches: [main]
    paths: ['packs/design-feedback/**', '.github/workflows/design-feedback-tests.yml']
permissions:
  contents: read
jobs:
  design-feedback-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s packs/design-feedback/tests -v
