name: Design Feedback Pack Tests
on:
  pull_request:
    branches: [main]
    paths: ['packs/design-feedback/**', '.github/workflows/design-feedback-tests.yml']
  push:
    branches: [main]
    paths: ['packs/design-feedback/**', '.github/workflows/design-feedback-tests.yml']
permissions:
  contents: read
jobs:
  design-feedback-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s packs/design-feedback/tests -v
