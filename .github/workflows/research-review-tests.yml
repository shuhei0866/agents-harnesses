name: Research Review Pack Tests

on:
  pull_request:
    branches: [main]
    paths: ['packs/research-review/**', '.github/workflows/research-review-tests.yml']
  push:
    branches: [main]
    paths: ['packs/research-review/**', '.github/workflows/research-review-tests.yml']

permissions:
  contents: read

jobs:
  research-review-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s packs/research-review/tests -v
