name: Local Sessions MCP

on:
  push:
    paths:
      - 'mcp/local-sessions/**'
      - '.github/workflows/local-sessions-tests.yml'
  pull_request:
    paths:
      - 'mcp/local-sessions/**'
      - '.github/workflows/local-sessions-tests.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp/local-sessions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/check_distribution.py
