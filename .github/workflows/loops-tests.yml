name: Loops Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  loops-tests:
    # loops/lib は sed と grep で JSON を切り出すので、GNU 系と BSD 系の
    # 方言差でどちらか一方だけ壊れる。実際 progress.sh は grep -oP と BRE の
    # \? を使っており、macOS では 15 件中 6 件が落ちていた (IAM-119)。
    # また macOS の PATH 上の bash は 3.2 なので、bash 4 以降の構文（local -A
    # など）もこちらで弾かれる (IAM-175)。
    # 片側でしか通らない書き方を弾くため、両方の系統で回す。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show tool flavors
        run: |
          if sed --version >/dev/null 2>&1; then sed --version | head -1; else echo "sed: BSD flavor"; fi
          if grep --version >/dev/null 2>&1; then grep --version | head -1; else echo "grep: BSD flavor"; fi
          bash --version | head -1

      - name: Run loops tests
        env:
          # macOS でだけ外すテストを空白区切りで並べる。今は空で、loops/tests を
          # すべて回す（IAM-175 で backlog-collect.sh を bash 3.2 で動くようにし、
          # 外していた test-backlog-collect.sh と test-claude-loop.sh を戻した）。
          #
          # 外すときは環境変数で明示し、スキップした事実をログにも出す。黙って対象を
          # 減らすと「両方の系統で全部通っている」と読めてしまうため。
          SKIP_ON_MACOS: ''
        run: |
          set -euo pipefail
          for t in loops/tests/test-*.sh; do
            name="$(basename "$t")"
            if [ "$RUNNER_OS" = "macOS" ] && printf '%s\n' $SKIP_ON_MACOS | grep -qx "$name"; then
              echo "::warning::$name は macOS でスキップした（SKIP_ON_MACOS で指定）"
              continue
            fi
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
