name: Loops Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  loops-tests:
    # loops/lib は sed と grep で JSON を切り出すので、GNU 系と BSD 系の
    # 方言差でどちらか一方だけ壊れる。実際 progress.sh は grep -oP と BRE の
    # \? を使っており、macOS では 15 件中 6 件が落ちていた (IAM-119)。
    # 片側でしか通らない書き方を弾くため、両方の系統で回す。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show tool flavors
        run: |
          if sed --version >/dev/null 2>&1; then sed --version | head -1; else echo "sed: BSD flavor"; fi
          if grep --version >/dev/null 2>&1; then grep --version | head -1; else echo "grep: BSD flavor"; fi
          bash --version | head -1

      - name: Run loops tests
        env:
          # backlog-collect.sh:197 が local -A（連想配列、bash 4 以降）を使うため、
          # bash 3.2 しか積まない macOS では起動できず、依存する claude-loop も
          # 巻き込んで落ちる。IAM-119 とは別の根なので別件で直す。
          #
          # 除外は環境変数で明示し、スキップした事実をログにも出す。黙って対象を
          # 減らすと「両方の系統で全部通っている」と読めてしまうため。
          SKIP_ON_MACOS: 'test-backlog-collect.sh test-claude-loop.sh'
        run: |
          set -euo pipefail
          for t in loops/tests/test-*.sh; do
            name="$(basename "$t")"
            if [ "$RUNNER_OS" = "macOS" ] && printf '%s\n' $SKIP_ON_MACOS | grep -qx "$name"; then
              echo "::warning::$name は macOS でスキップした（bash 3.2 非対応。別 issue で対応中）"
              continue
            fi
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
